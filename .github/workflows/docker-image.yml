name: CI/CD Pipeline - Codacy & Docker Hub

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ----------------------------------------------------
  # 1. CI: Inspección estática de código con Codacy
  # ----------------------------------------------------
  codacy-analysis:
    name: Codacy Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar análisis estático con Codacy CLI
        uses: codacy/codacy-analysis-cli-action@master
        continue-on-error: true # Permite seguir al deploy aunque haya advertencias menores de estilo
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif

  # ----------------------------------------------------
  # 2. CD: Build y Push a Docker Hub con versión incremental (+1)
  # ----------------------------------------------------
  docker-deploy:
    name: Docker Build & Push
    needs: codacy-analysis
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Bonus Track: Cada ejecución de GitHub Actions suma +1 de forma nativa
      - name: Generar tag de versión incremental (+1)
        id: versioning
        run: |
          # Si tu última versión manual fue 1.0.1, esto creará tags incrementales: 1.0.2, 1.0.3, etc.
          # Calculamos la versión base sumando el número de ejecución:
          BASE_MINOR=1
          RUN_NUM=${{ github.run_number }}
          PATCH=$((BASE_MINOR + RUN_NUM))
          
          # Guarda la versión (ej: 1.0.2, 1.0.3) y una versión corta (v2, v3)
          echo "VERSION=1.0.${PATCH}" >> $GITHUB_OUTPUT
          echo "BUILD_TAG=v${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Compilar y Pushear imagen a Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            kevinbiz/express-health-info-api:latest
            kevinbiz/express-health-info-api:${{ steps.versioning.outputs.VERSION }}
            kevinbiz/express-health-info-api:${{ steps.versioning.outputs.BUILD_TAG }}
