name: Node.js & Docker CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Verify Node.js API
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🟢 Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🔍 Verificar sintaxis del código
        run: |
          node --check src/index.js
          node --check src/app.js
          node --check src/controllers/health.controller.js
          node --check src/controllers/info.controller.js

      - name: 🚀 Probar servidor y endpoints HTTP
        run: |
          npm start &
          SERVER_PID=$!
          sleep 3
          curl -f http://localhost:3000/api/v1/health || exit 1
          curl -f http://localhost:3000/api/v1/info || exit 1
          curl -f http://localhost:3000/api/v1/ping || exit 1
          curl -f http://localhost:3000/openapi.json || exit 1
          curl -f http://localhost:3000/docs || exit 1
          kill $SERVER_PID

  docker-build:
    name: Verify Docker Image Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Probar compilación de imagen Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: express-health-info-api:test
